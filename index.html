<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Grau Games</title>
<meta name="description" content="Small browser games you can play instantly. No install, no signup, no ads." />
<meta name="theme-color" content="#e6dfd1" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='26' y='26' width='62' height='62'/><rect x='12' y='12' width='62' height='62' fill='%23b6674f' stroke='%23000' stroke-width='9'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<meta property="og:title" content="Grau Games" />
<meta property="og:description" content="Small browser games you can play instantly. No install, no signup, no ads." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://graugames.github.io/" />
<meta property="og:image" content="https://graugames.github.io/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="The Grau Games wordmark on a yellow grid" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<!-- the signal chases the cursor behind everything -->
<div class="blob" id="blob" hidden aria-hidden="true"></div>

<header class="site-header">
  <a class="wordmark" href="./" aria-label="Grau Games">
    <span class="w-1">GRAU</span><span class="w-2">GAMES</span>
  </a>
  <div class="header-meta" aria-label="Grau Games status">
    <span class="header-id">GG / 001</span>
    <span class="status"><i aria-hidden="true"></i> OPEN NOW</span>
  </div>
</header>

<main>
  <section class="arcade" id="arcade" aria-labelledby="shelf-title">
    <div class="section-head">
      <div>
        <p class="eyebrow"><span>01</span> THE SHELF</p>
        <h2 id="shelf-title">Choose a game.</h2>
      </div>
      <p class="section-note"><b id="liveCount">0</b> game ready now<br /><b id="soonCount">0</b> in the workshop</p>
    </div>

    <div class="shelf" id="shelf" aria-label="Games"></div>
  </section>
</main>

<footer class="site-footer">
  <span>GRAU GAMES / BROWSER-BASED / ALWAYS FREE TO PLAY</span>
  <span class="footer-mark">GG—<b>001</b></span>
</footer>

<script type="module" src="./main.js"></script>

</body>
</html>
